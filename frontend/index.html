<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/src/assets/mic_emblem.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MIC Intellica — Faculty Research Insights Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script>
    // Handle stale cached index.html referencing superseded asset chunks
    window.addEventListener('error', function (e) {
      if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
        var key = 'intellica_last_chunk_refresh';
        var last = sessionStorage.getItem(key);
        var now = Date.now();
        if (!last || now - parseInt(last, 10) > 8000) {
          sessionStorage.setItem(key, now.toString());
          window.location.reload();
        }
      }
    }, true);
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
